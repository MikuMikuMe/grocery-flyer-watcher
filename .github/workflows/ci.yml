name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests (offline; no real email)
        run: python -m unittest discover -s tests -v
      - name: Validate historical public snapshot
        run: grocery-flyer-watch validate data/latest.json
      - name: Legacy CLI compatibility
        run: python -m metro_flyer_watch validate data/latest.json
      - name: Render historical report
        run: grocery-flyer-watch report data/latest.json
