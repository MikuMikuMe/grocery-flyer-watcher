name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate public snapshot
        run: PYTHONPATH=src python -m metro_flyer_watch validate data/latest.json
      - name: Render report
        run: PYTHONPATH=src python -m metro_flyer_watch report data/latest.json
