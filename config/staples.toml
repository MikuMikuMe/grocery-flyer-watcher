# PUBLIC Staples Canada profile. No contacts, personal postal codes or credentials.
# Paths are relative to this file, following the existing single-profile CLI contract.
market = "Kingston, Ontario"
retailer = "Staples"
timezone = "America/Toronto"
sources = [
  "https://www.staples.ca/a/content/flyers",
  "https://www.staples.ca/collections/staples-deals-centre",
  "https://www.staples.ca/collections/staples-clearance-centre-7922",
  "https://stores.staples.ca/on/kingston/",
  "https://stores.staples.ca/on/kingston/office-supplies-ca-23.html",
  "https://stores.staples.ca/on/kingston/office-supplies-ca-133.html",
  "https://help.staples.ca/hc/en-us/articles/4402322974359-Deal-Promotion-Rebate-Information-and-Policies",
  "https://flyers.smartcanucks.ca/staples-canada",
  "https://www.flyers-on-line.com/staples",
  "https://www.flyerbox.ca/deals/kingston/staples/",
  "https://www.canadiansavers.ca/flyers/staples-flyer/",
  "https://www.adssos.net/ca/staples/",
  "https://flipp.com/en-ca/kingston-on"
]
# Monitor all categories: there is no category allowlist or exclusion by department.
# Deals Centre and Clearance Centre are monitored offer sources, not just flyer references.
# Official store references are public retail locations. Home-store preference stays private.
# Apply the private store selection before checking pickup or store-specific price/stock.
# Never substitute a default Toronto store, another branch or national online inventory.
# Staples subdomains are one source family, not independent corroboration.
# CanadianSavers and AdsSOS are third-party national flyer archives, not local stock proof.
# Discovery links and archive headings do not establish valid/current advertised offers.
collector = []
state_file = "../private/staples-state.json"
output_dir = "../public"
publication = "local"
notification = "none"
# Safe CLI defaults do not override the private task's authorized conditional delivery.
# Undated collection observations require the agent/orchestrator protocol in docs/STAPLES.md.
