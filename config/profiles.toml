# Public enabled-profile registry. All paths below are relative to the repository root.
# This is orchestration metadata, not a single-profile CLI configuration.
version = 1

[[profiles]]
id = "metro"
config = "config/watch.toml"
baseline = "data/latest.json"
report_dir = "reports"

[[profiles]]
id = "shoppers-drug-mart"
config = "config/shoppers.toml"
baseline = "data/shoppers-drug-mart/latest.json"
report_dir = "reports/shoppers-drug-mart"
policy = "docs/SHOPPERS.md"

[[profiles]]
id = "rexall"
config = "config/rexall.toml"
baseline = "data/rexall/latest.json"
report_dir = "reports/rexall"
policy = "docs/REXALL.md"

[[profiles]]
id = "staples"
config = "config/staples.toml"
baseline = "data/staples/latest.json"
report_dir = "reports/staples"
policy = "docs/STAPLES.md"

[[profiles]]
id = "food-basics"
config = "config/food-basics.toml"
baseline = "data/food-basics/latest.json"
report_dir = "reports/food-basics"
policy = "docs/FOOD_BASICS.md"

[[profiles]]
id = "walmart"
config = "config/walmart.toml"
baseline = "data/walmart/latest.json"
report_dir = "reports/walmart"
policy = "docs/WALMART.md"

[[profiles]]
id = "costco"
config = "config/costco.toml"
baseline = "data/costco/latest.json"
report_dir = "reports/costco"
policy = "docs/COSTCO.md"
